name: CI – train & test

on:
  push:
    branches: [ dev ]      # run whenever you push to dev
  pull_request:
    branches: [ dev ]      # and for PRs targeting dev
  workflow_dispatch:        # (optional) adds a “Run workflow” button

jobs:
  check_working_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model (writes models/savedmodel.pth)
        run: python train.py

      - name: List artifacts folder
        run: ls -l models

      - name: Test model (prints accuracy)
        run: python test.py

      - name: Upload trained model artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: savedmodel
          path: models/savedmodel.pth
